<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บันทึก Core Optic → Diagram</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#14202e;--mut:#5d6b7c;--line:#d3dae3;--acc:#0a5fd6;--accInk:#fff;--ok:#0d8a4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151c;--card:#19222c;--ink:#e8eef5;--mut:#93a1b2;--line:#2b3846;--acc:#4d9bff;--accInk:#06101c;--ok:#3fd08a}}
:root[data-theme="dark"]{--bg:#0f151c;--card:#19222c;--ink:#e8eef5;--mut:#93a1b2;--line:#2b3846;--acc:#4d9bff;--accInk:#06101c;--ok:#3fd08a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Sarabun,"Noto Sans Thai",system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:14px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:16px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mut);margin:6px 0 2px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.chip{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font:inherit;cursor:pointer}
.chip.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{padding:10px 16px;border:0;border-radius:8px;background:var(--acc);color:var(--accInk);font:inherit;font-weight:600;cursor:pointer}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tube{display:flex;gap:6px;margin:4px 0}.tube>i{width:8px;border-radius:3px;flex:none;border:1px solid #0003}
.cells{display:flex;flex-wrap:wrap;gap:4px}
.core{width:50px;padding:2px;border:2px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);cursor:pointer;font:inherit;display:flex;flex-direction:column;align-items:center}
.core b{width:100%;border-radius:4px;font-size:13px;line-height:20px}
.core small{font-size:9px;height:12px;line-height:12px;overflow:hidden;max-width:44px;color:var(--mut)}
.core.used{opacity:.6}.core.full{opacity:.35;cursor:not-allowed}.core.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.sel{font-size:13px;color:var(--mut);margin-top:6px}
.li{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.li span{flex:1}.li button{border:0;background:none;color:#d33;font-size:18px;cursor:pointer}
.sp{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.sp span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:13px}
.sp button{border:0;background:none;color:#d33;cursor:pointer}
.dia{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;max-height:75vh}
.dbr{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
#msg{color:var(--ok);font-size:14px;min-height:20px;margin-top:6px}
</style></head><body><main>
<h1>บันทึก Core Optic → Diagram</h1>
<div class="card">
<h2>ประเภทการเชื่อมต่อ</h2>
<div class="row" id="types"></div>
<label for="title">ชื่องาน / ชื่อไซต์ (ไม่บังคับ)</label>
<input id="title" placeholder="เช่น BJ 3แยก — BJ ME/OLTเทา">
<div class="row"><div style="flex:1;min-width:140px"><label for="job">เลขงาน / JB</label><input id="job" placeholder="JB26-xxxxxxx"></div><div style="flex:1;min-width:140px"><label for="rec">ผู้บันทึก</label><input id="rec"></div><div style="flex:1;min-width:140px"><label for="date">วันที่</label><input id="date" type="date"></div></div><label for="note">หมายเหตุทั่วไป</label><input id="note" placeholder="รายละเอียดเพิ่มเติม">
</div>
<div class="cabs" id="cabs"></div>
<div class="row" style="margin:0 0 12px"><button class="btn alt" data-add="1" id="add">+ เพิ่ม ODF / BJ / SJ</button></div>
<div class="card">
<h2>เชื่อม core</h2>
<div class="sel" id="selinfo"></div>
<label>วงจร (Comm) — แตะเลือก หรือพิมพ์เอง</label>
<div class="row" id="comms"></div>
<div class="row" style="margin-top:6px"><input id="comm" style="max-width:220px" placeholder="Comm เช่น LinkME">
<input id="text" style="flex:1;min-width:220px" placeholder="รายละเอียดบนเส้น เช่น ME-9706-36 0/1/2 <==> ME-9720-29 0/1/1"></div>
<div class="row" style="margin-top:6px"><div style="flex:2;min-width:180px"><label for="pc">Patch cord</label><select id="pc"></select></div>
<div style="flex:1;min-width:110px"><label for="pcLen">ความยาว (เมตร)</label><input id="pcLen" inputmode="decimal" placeholder="เช่น 3"></div></div>
<div class="row" style="margin-top:10px"><button class="btn" id="go">เชื่อม core ที่เลือก</button><button class="btn alt" id="clr">ล้างที่เลือก</button><button class="btn alt" data-u="undo">↶ ย้อนกลับ</button><button class="btn alt" data-u="redo">↷ ทำซ้ำ</button></div>
<div id="msg" role="status"></div>
<div id="list"></div>
</div>
<div class="card">
<h2>ฐานข้อมูล (Supabase)</h2>
<div class="row"><button class="btn" id="dbsave">บันทึกงานนี้</button><button class="btn alt" id="dbnew">บันทึกเป็นงานใหม่</button><button class="btn alt" id="dbref">รีเฟรชรายการ</button></div>
<div id="dbmsg" class="sel" role="status"></div>
<div id="dblist"></div>
</div>
<div class="card">
<h2>Diagram</h2>
<div class="row" style="margin-bottom:10px">
<button class="btn" data-x="pdf">ส่งออก PDF</button><button class="btn alt" data-x="png">PNG</button>
<button class="btn alt" data-x="svg">SVG</button><button class="btn alt" data-x="csv">Excel (CSV)</button>
<button class="btn alt" data-u="undo">↶ ย้อนกลับ</button><button class="btn alt" data-u="redo">↷ ทำซ้ำ</button><button class="btn alt" id="reset">เริ่มใหม่</button></div>
<div class="dia" id="dia"></div>
</div>
</main>
<script>
const $=s=>document.querySelector(s);
const FC=[["Blue","#0000ff","#fff"],["Orange","#ff8000","#000"],["Green","#3cb034","#000"],["Brown","#8b5a2b","#fff"],["Grey","#808080","#fff"],["White","#ffffff","#000"],["Red","#e60000","#fff"],["Black","#111111","#fff"],["Yellow","#ffee00","#000"],["Violet","#9b30c0","#fff"],["Pink","#ff69b4","#000"],["Transparent","#e3f1f7","#000"]];
const TYPES=["ME to ME","ME to OLT","OLT to OLT","OLT to L1 to L2"];
const SIZES=[12,24,36,48,60,72,96,144];
const FIB=["ADSS","ARSS","DW","FIG8"];
const COMMS=["LinkME","ERPS","Gpon0","Gpon1","Gpon2","Gpon3","Gpon4"];
const PCS=["ไม่มี","SC/UPC–SC/UPC","SC/APC–SC/APC","SC–LC","LC–LC","FC–SC","FC–LC","อื่นๆ"];
const cc=n=>/^gpon/i.test(n)?"#e000e0":/^erps/i.test(n)?"#009a9a":/^link/i.test(n)?"#00a000":"#444";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KEY="opticCoreV2";
const fresh=()=>({title:"",type:"ME to OLT",nid:3,cables:[{id:1,name:"",size:24,fiber:FIB[0],slack:[],kind:"ODF"},{id:2,name:"",size:12,fiber:FIB[0],slack:[],kind:"BJ"}],links:[],comm:"LinkME",pc:PCS[0],pcLen:""});
let S=fresh();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
S.cables.forEach((c,i)=>{if(!FIB.includes(c.fiber))c.fiber=FIB[0];if(!c.kind)c.kind=i?"BJ":"ODF"});
let SEL={},dim=[0,0],HL=-1;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const cab=id=>S.cables.find(c=>c.id===id);
const idx=id=>S.cables.findIndex(c=>c.id===id);
const cname=id=>{const c=cab(id);return c?(c.name||(c.kind||"BJ")+" "+(idx(id)+1)):"?"};
const say=t=>{$("#msg").textContent=t};
const tsz=c=>c.size===12?6:12;
const fcol=(c,n)=>FC[(n-1)%tsz(c)];
let hist=[],redo=[];
const ub=()=>document.querySelectorAll("[data-u]").forEach(b=>b.disabled=b.dataset.u==="undo"?!hist.length:!redo.length);
const snap=()=>{hist.push(JSON.stringify(S));if(hist.length>60)hist.shift();redo=[];ub()};
function undo(r){const from=r?redo:hist,to=r?hist:redo;if(!from.length)return;to.push(JSON.stringify(S));S=Object.assign(fresh(),JSON.parse(from.pop()));SEL={};all();say(r?"ทำซ้ำแล้ว":"ย้อนกลับแล้ว")}
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)){e.preventDefault();undo(e.shiftKey)}});
function usedOf(id){const m={};S.links.forEach(l=>{if(l.ca===id)(m[l.a]=m[l.a]||[]).push(l);if(l.cb===id)(m[l.b]=m[l.b]||[]).push(l)});return m}

function hdr(){
 $("#types").innerHTML=TYPES.map(t=>`<button class="chip${S.type===t?" on":""}" data-t="${t}">${t}</button>`).join("");
 $("#comms").innerHTML=COMMS.map(t=>`<button class="chip${S.comm===t?" on":""}" data-cm="${t}">${t}</button>`).join("");
 $("#pc").innerHTML=PCS.map(n=>`<option${S.pc===n?" selected":""}>${n}</option>`).join("");
 $("#title").value=S.title;["job","rec","date","note"].forEach(k=>$("#"+k).value=S[k]||"");$("#comm").value=S.comm;$("#pcLen").value=S.pcLen;
 $("#add").style.display="";
}
function cards(){
 $("#cabs").innerHTML=S.cables.map((c,i)=>`<div class="card"><div class="row" style="justify-content:space-between"><h2>${c.kind||"BJ"} ที่ ${i+1}${i===0?" (ต้นทาง)":i===S.cables.length-1?" (ปลายทาง)":""}</h2>${S.cables.length>2?`<button class="chip" data-rm="${c.id}">ลบ</button>`:""}</div>
 <label>ประเภท</label><select data-f="kind" data-cb="${c.id}">${["ODF","BJ","SJ"].map(k=>`<option${(c.kind||"BJ")===k?" selected":""}>${k}</option>`).join("")}</select>
 <label>ชื่อ (ODF / BJ / SJ)</label><input data-f="name" data-cb="${c.id}" value="${esc(c.name)}" placeholder="เช่น ODF SITE MEWAD 60C">
 <div class="row"><div style="flex:1"><label>ขนาด optic</label><select data-f="size" data-cb="${c.id}">${SIZES.map(n=>`<option${c.size===n?" selected":""} value="${n}">${n} core</option>`).join("")}</select></div>
 <div style="flex:2"><label>ประเภท optic</label><select data-f="fiber" data-cb="${c.id}">${FIB.map(n=>`<option${c.fiber===n?" selected":""}>${n}</option>`).join("")}</select></div></div>
 <div class="row"><div style="flex:1"><label>ระยะทางสาย</label><input data-f="dist" data-cb="${c.id}" value="${esc(c.dist||"")}" placeholder="เช่น 2.5 กม."></div><div style="flex:2"><label>หมายเหตุ / รายละเอียด</label><input data-f="note" data-cb="${c.id}" value="${esc(c.note||"")}" placeholder="เช่น เลขท่อ, เส้นทาง, ผู้เช่า"></div></div>
 <label>จุดพักสาย (สถานที่ + ความยาวเมตร)</label>
 <div class="row"><input data-sp="${c.id}" style="flex:2;min-width:120px" placeholder="เช่น HH-12 / เสา 45"><input data-sl="${c.id}" style="flex:1;min-width:70px" inputmode="decimal" placeholder="เมตร"><button class="chip" data-as="${c.id}">เพิ่ม</button></div>
 <div class="sp">${c.slack.map((s,k)=>`<span>${esc(s.place)} · ${esc(s.len)} ม. <button data-ds="${c.id}" data-k="${k}" aria-label="ลบ">✕</button></span>`).join("")}</div>
 <div id="g${c.id}" style="margin-top:8px"></div></div>`).join("");
 S.cables.forEach(c=>grid(c.id));
}
function grid(id){
 const c=cab(id),u=usedOf(id),sel=SEL[id]||[];let h="";
 const ts=tsz(c);for(let t=0;t<c.size/ts;t++){
  h+=`<div class="tube"><i style="background:${FC[t%12][1]}" title="Tube ${t+1} ${FC[t%12][0]}"></i><div class="cells">`;
  for(let k=0;k<ts;k++){const n=t*ts+k+1;if(n>c.size)break;const f=FC[k],L=u[n]||[],full=L.length>=2;
   h+=`<button class="core${L.length?" used":""}${full?" full":""}${sel.includes(n)?" on":""}" data-n="${n}" data-cb="${id}"${full?" disabled":""} title="${f[0]}${L.length?" – "+esc(L.map(x=>x.comm).join(", ")):""}"><b style="background:${f[1]};color:${f[2]}">${n}</b><small>${L.length?esc(L[L.length-1].comm):""}</small></button>`}
  h+="</div></div>"}
 const g=$("#g"+id);if(g)g.innerHTML=h;
}
function list(){
 $("#list").innerHTML=S.links.length?S.links.map((l,i)=>`<div class="li" data-i="${i}" style="cursor:pointer" title="แตะเพื่อไฮไลต์เส้นนี้ใน diagram"><span><b>${esc(cname(l.ca))}</b> ${l.a} (${fcol(cab(l.ca),l.a)[0]}) → <b>${esc(cname(l.cb))}</b> ${l.b} (${fcol(cab(l.cb),l.b)[0]}) · ${esc(l.comm)} ${esc(l.text||"")}${l.pc&&l.pc!==PCS[0]?` · PC ${esc(l.pc)} ${esc(l.pcLen||"")}${l.pcLen?" ม.":""}`:""}</span><button data-d="${i}" aria-label="ลบ">✕</button></div>`).join(""):'<div class="sel">ยังไม่มีการเชื่อม — แตะ core ในสองกล่อง แล้วกด “เชื่อม”</div>';
 const s=S.cables.filter(c=>(SEL[c.id]||[]).length).map(c=>`${cname(c.id)}: ${SEL[c.id].join(", ")}`);
 $("#selinfo").textContent="เลือกแล้ว: "+(s.join(" | ")||"-");
}
function svg(){
 const R=17,tp=58,rows=Math.max(...S.cables.map(c=>c.size)),TW=168,x0=20,n=S.cables.length;
 const lw=l=>l.text?l.text.length*4.2+10:0;
 const chained=i=>i>=2&&S.links.some(l=>{const a=idx(l.ca),b=idx(l.cb);return (a===i-1&&b===i)||(a===i&&b===i-1)});
 const CO=[];S.cables.forEach((c,i)=>{CO[i]=i===0?0:i===1?1:chained(i)?CO[i-1]+1:CO[i-1]});
 const COL=i=>CO[i];
 const gkey=(a,b)=>COL(a)===COL(b)?"s"+COL(a):COL(a)+"-"+COL(b);
 const grp={};S.links.forEach(l=>{const a=idx(l.ca),b=idx(l.cb);if(a<0||b<0)return;(grp[gkey(a,b)]=grp[gkey(a,b)]||[]).push(l)});
 let GAP=300;Object.values(grp).forEach(g=>{GAP=Math.max(GAP,Math.max(...g.map(lw))+g.length*13+60)});
 const maxSl=Math.max(0,...S.cables.map(c=>c.slack.length+(c.note?1:0)));
 
 const blk=c=>R*(c.size+1)+((c.slack.length||c.note)?14+(c.slack.length+(c.note?1:0))*11:0)+30;
 const Y0={};S.cables.forEach((c,i)=>{Y0[c.id]=i>1&&!chained(i)?Y0[S.cables[i-1].id]+blk(S.cables[i-1])+24:tp});
 const cols=COL(n-1)+1,W=x0*2+cols*TW+(cols-1)*GAP,H=Math.max(...S.cables.map(c=>Y0[c.id]+blk(c)))+(S.note?16:0);dim=[W,H];
 const X=i=>x0+COL(i)*(TW+GAP);
 let o=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Sarabun,Arial,sans-serif"><rect width="${W}" height="${H}" fill="#fff"/>`;
 o+=`<text x="${W/2}" y="16" text-anchor="middle" font-size="12" font-weight="700" fill="#000">${esc(S.title||"Core Optic Diagram")} (${esc(S.type)})</text>`;
 const mm=[S.job&&"เลขงาน: "+S.job,S.rec&&"ผู้บันทึก: "+S.rec,S.date&&"วันที่: "+S.date].filter(Boolean).join("   |   ");if(mm)o+=`<text x="${W/2}" y="30" text-anchor="middle" font-size="9" fill="#333">${esc(mm)}</text>`;
 const cell=(x,y,w,fill,txt,fs,col,wt)=>`<rect x="${x}" y="${y}" width="${w}" height="${R}" fill="${fill}" stroke="#333" stroke-width=".6"/>`+(txt!==""?`<text x="${x+w/2}" y="${y+R/2+3}" text-anchor="middle" font-size="${fs}" fill="${col}"${wt?' font-weight="700"':""}>${esc(txt)}</text>`:"");
 S.cables.forEach((c,i)=>{
  const x=X(i),u=usedOf(c.id),tp=Y0[c.id];
  const cols=i===0?[["Comm",62],["Fiber",66],["Md",16],["Nº",24]]:[["Nº",24],["Md",16],["Fiber",66],["Comm",62]];
  o+=`<text x="${x+TW/2}" y="${tp-18}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#000">${esc(cname(c.id))}</text><text x="${x+TW/2}" y="${tp-7}" text-anchor="middle" font-size="8" fill="#444">${c.size} core · ${esc(c.fiber)}${c.dist?" · "+esc(c.dist):""}</text>`;
  let cx=x;const pos={};cols.forEach(([nm,w])=>{pos[nm]=[cx,w];o+=cell(cx,tp,w,"#ccc",nm,8,"#000",1);cx+=w});
  for(let k=1;k<=c.size;k++){
   const y=tp+R*k,f=fcol(c,k),L=u[k];
   o+=cell(pos.Comm[0],y,pos.Comm[1],"#fff",L?L.map(l=>l.comm).join("/"):"",7,"#000");
   o+=cell(pos.Fiber[0],y,pos.Fiber[1],f[1],f[0],8,f[2]);
   o+=cell(pos["Nº"][0],y,pos["Nº"][1],"#fff",k,8,"#000");
   if((k-1)%tsz(c)===0){const t=(k-1)/tsz(c),m=Math.min(tsz(c),c.size-k+1),tc=FC[t%12],mx=pos.Md[0];
    o+=`<rect x="${mx}" y="${y}" width="16" height="${R*m}" fill="${tc[1]}" stroke="#333" stroke-width=".6"/><text transform="rotate(-90 ${mx+11} ${y+R*m/2})" x="${mx+11}" y="${y+R*m/2}" text-anchor="middle" font-size="7" fill="${tc[2]}">${t+1} ${tc[0]}</text>`}
  }
  if(c.slack.length||c.note){const sy=tp+R*(c.size+1)+14;
   o+=(c.slack.length?`<text x="${x}" y="${sy}" font-size="8.5" font-weight="700" fill="#b45f00">จุดพักสาย</text>`:"")+c.slack.map((s,k)=>`<text x="${x}" y="${sy+11*(k+1)}" font-size="8" fill="#000">◎ ${esc(s.place)}${s.len?" — "+esc(s.len)+" ม.":""}</text>`).join("")+(c.note?`<text x="${x}" y="${sy+11*(c.slack.length+1)}" font-size="8" fill="#555">หมายเหตุ: ${esc(c.note)}</text>`:"")}
 });
 const chx=new Map();
 Object.values(grp).forEach(g=>{const yA=l=>Y0[l.ca]+R*l.a,yB=l=>Y0[l.cb]+R*l.b,dn=g.filter(l=>yB(l)>yA(l)).sort((p,q)=>yA(q)-yA(p)),up=g.filter(l=>yB(l)<yA(l)).sort((p,q)=>yA(p)-yA(q));
  [...dn,...up].forEach((l,j)=>chx.set(l,j));g._ml=Math.max(...g.map(lw))});
 S.links.forEach((l,i)=>{
  const ia=idx(l.ca),ib=idx(l.cb);if(ia<0||ib<0)return;
  const g=grp[gkey(ia,ib)],y1=Y0[l.ca]+R*l.a+R/2,y2=Y0[l.cb]+R*l.b+R/2,same=COL(ia)===COL(ib),xa=same?X(ia):X(ia)+TW,xb=X(ib),col=cc(l.comm),hasPc=l.pc&&l.pc!==PCS[0];
  const xc=chx.has(l)?(same?xa-8-7*chx.get(l):xa+14+g._ml+13*chx.get(l)+6):xa;
  const fc=fcol(cab(l.ca),l.a)[1],pd=`M${xa} ${y1}H${xc}V${y2}H${xb}`;

 });

async function canvas(){
 const img=new Image();img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg());await img.decode();
 const sc=Math.min(2,12000/Math.max(dim[0],dim[1])),c=document.createElement("canvas");c.width=Math.round(dim[0]*sc);c.height=Math.round(dim[1]*sc);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);return c}
function pdf(jpg,pw,ph,w,h){
 const e=new TextEncoder(),parts=[],off=[];let len=0;
 const add=b=>{if(typeof b==="string")b=e.encode(b);parts.push(b);len+=b.length};
 const obj=(n,s)=>{off[n]=len;add(`${n} 0 obj\n${s}\nendobj\n`)};
 add("%PDF-1.4\n");obj(1,"<</Type/Catalog/Pages 2 0 R>>");obj(2,"<</Type/Pages/Kids[3 0 R]/Count 1>>");
 obj(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</I 4 0 R>>>>/Contents 5 0 R>>`);
 off[4]=len;add(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${w}/Height ${h}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n`);add(jpg);add("\nendstream\nendobj\n");
 const cs=`q ${pw} 0 0 ${ph} 0 0 cm /I Do Q`;obj(5,`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`);
 const xr=len;add("xref\n0 6\n0000000000 65535 f \n"+[1,2,3,4,5].map(n=>String(off[n]).padStart(10,"0")+" 00000 n \n").join("")+`trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
 return new Blob(parts,{type:"application/pdf"});
}
async function out(name,data){
 let d=null;try{d=window.claude?await claude.use("downloads"):null}catch(e){}
 if(!d){const u=URL.createObjectURL(data),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);say("ดาวน์โหลดแล้ว: "+name);return}
 try{await d.save({filename:name,data});say("บันทึกไฟล์แล้ว: "+name)}catch(e){if(e&&e.code!=="declined")say("บันทึกไฟล์ไม่สำเร็จ")}
}
async function exportAs(k){
 const base=(S.title||"optic-core").replace(/[\\/:*?"<>|\s]+/g,"_");
 try{
  if(k==="svg")return out(base+".svg",new Blob([svg()],{type:"image/svg+xml"}));
  if(k==="csv"){
   const q=v=>'"'+String(v).replace(/"/g,'""')+'"',ln=a=>a.map(q).join(",");
   const h=["ต้นทาง","core ต้นทาง","สี","ปลายทาง","core ปลายทาง","สี","Comm","รายละเอียด","Patch cord","ความยาว PC (ม.)","ขนาด optic ต้นทาง","ประเภท optic ต้นทาง","ขนาด optic ปลายทาง","ประเภท optic ปลายทาง","ประเภทเชื่อมต่อ"];
   const rows=S.links.map(l=>{const A=cab(l.ca),B=cab(l.cb);return ln([cname(l.ca),l.a,fcol(A,l.a)[0],cname(l.cb),l.b,fcol(B,l.b)[0],l.comm,l.text,l.pc===PCS[0]?"":l.pc,l.pcLen,A.size,A.fiber,B.size,B.fiber,S.type])});
   const sl=[];S.cables.forEach(c=>c.slack.forEach(s=>sl.push(ln([cname(c.id),s.place,s.len]))));
   const lines=[ln(h),...rows];if(sl.length)lines.push("",ln(["กล่อง","จุดพักสาย","ความยาว (ม.)"]),...sl);
   return out(base+".csv",new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv"}));
  }
  const c=await canvas();
  if(k==="png")return out(base+".png",await new Promise(r=>c.toBlob(r,"image/png")));
  if(k==="pdf"){const u=c.toDataURL("image/jpeg",.92).split(",")[1],bin=atob(u),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
   return out(base+".pdf",pdf(a,dim[0],dim[1],c.width,c.height))}
 }catch(e){say("ส่งออกไม่สำเร็จ ลองใหม่อีกครั้ง")}
}
